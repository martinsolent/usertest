<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment – Greenleaf Café</title>
<link rel="stylesheet" href="site.css">
<script src="basket.js"></script>
</head>
<body>
<header>
  <a class="logo" href="index.html">Greenleaf</a>
  <nav>
    <a href="menu.html">Menu</a>
    <a href="order.html">Order ahead</a>
    <a href="index.html#find-us">Find us</a>
    <a href="order.html"><strong>Basket (<span class="basket-count">0</span>)</strong></a>
  </nav>
</header>
<main>
  <h1>Payment</h1>
  <p class="lead">Collecting at <strong id="when"></strong></p>
  <div class="panel" style="max-width:420px;display:flex;flex-direction:column;gap:12px">
    <label style="display:flex;flex-direction:column;gap:6px">Card number
      <input type="text" disabled placeholder="This is a prototype" style="padding:10px;border-radius:6px;border:1px solid #D8D2C2;font:inherit">
    </label>
    <button class="btn" type="button" disabled style="opacity:.6">Pay now</button>
  </div>
  <a href="order.html">Back to your order</a>
</main>
<script>
  document.getElementById('when').textContent = localStorage.getItem('greenleaf-time') || 'As soon as possible';
</script>
</body>
</html>
